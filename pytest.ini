[pytest]
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s (%(filename)s:%(lineno)d)
log_cli_date_format = %Y-%m-%d %H:%M:%S
addopts = --html=reports/report.html -v -s --junitxml=reports/result.xml
desktop_base_url = https://www.naver.com
mobile_base_url = https://m.naver.com
markers = 
    regression
    desktop
    mobile
    feature(name)